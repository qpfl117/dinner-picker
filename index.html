<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘 저녁 뭐 먹지? 🍽️</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Malgun Gothic',sans-serif;background:#f7f6f2;min-height:100vh;padding:28px 16px 80px}
.wrap{max-width:680px;margin:0 auto}
h1{font-size:28px;font-weight:700;color:#1a1a1a;margin-bottom:6px}
.sub{font-size:15px;color:#888;margin-bottom:32px}
.section{margin-bottom:24px}
.sec-label{font-size:12px;font-weight:700;color:#999;letter-spacing:1px;margin-bottom:10px;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:99px;border:1.5px solid #ddd;background:#fff;font-size:15px;font-weight:400;color:#444;cursor:pointer;transition:all .15s;user-select:none;-webkit-tap-highlight-color:transparent}
.chip:hover{border-color:#aaa;background:#fafafa}
.chip.on{border-color:#6c63d4;background:#eeecff;color:#3d37a0;font-weight:600}
.chip.disabled{opacity:.25;pointer-events:none}
.btn-row{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}
.btn-main{padding:14px 36px;border-radius:99px;border:none;background:#6c63d4;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.btn-main:hover{background:#5a52be}
.btn-main:active{transform:scale(.97)}
.btn-sub{padding:14px 20px;border-radius:99px;border:1.5px solid #ddd;background:#fff;color:#888;font-size:15px;cursor:pointer}
.btn-sub:hover{border-color:#aaa;color:#555}
.results{margin-top:32px}
.res-label{font-size:12px;font-weight:700;color:#999;letter-spacing:1px;margin-bottom:14px;text-transform:uppercase}
.card{background:#fff;border-radius:18px;border:1.5px solid #eee;padding:20px 22px;margin-bottom:12px}
.card.top{border-color:#6c63d4;box-shadow:0 0 0 4px #eeecff}
.badge{font-size:11px;font-weight:700;background:#eeecff;color:#3d37a0;padding:3px 10px;border-radius:99px;margin-bottom:8px;display:inline-block}
.card-name{font-size:21px;font-weight:700;color:#1a1a1a;margin-bottom:4px}
.card-desc{font-size:13px;color:#888;line-height:1.5;margin-bottom:0}
.no-result{padding:20px;border-radius:14px;border:1.5px solid #eee;background:#fafafa;color:#888;font-size:15px;text-align:center}
.btn-retry{margin-top:14px;padding:10px 22px;border-radius:99px;border:1.5px solid #ddd;background:#fff;color:#777;font-size:14px;cursor:pointer}
.survey-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sopt{padding:14px 16px;border-radius:14px;border:1.5px solid #eee;background:#fff;cursor:pointer;text-align:left;transition:all .15s;font-size:14px;color:#444;display:flex;align-items:center;gap:8px}
.sopt:hover{border-color:#aaa}
.sopt.on{border-color:#6c63d4;background:#eeecff;color:#3d37a0;font-weight:600}
.sopt-emoji{font-size:22px}
.sopt-text{font-size:14px;line-height:1.4}
.sopt-text strong{display:block;font-size:15px;font-weight:700;color:#1a1a1a}
.sopt.on .sopt-text strong{color:#3d37a0}
.survey-result-banner{background:#eeecff;border-radius:14px;padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.survey-tags{display:flex;flex-wrap:wrap;gap:6px}
.survey-tag{font-size:12px;background:#6c63d4;color:#fff;padding:3px 10px;border-radius:99px;font-weight:500}
.shop-box{margin-top:12px;padding-top:12px;border-top:1px solid #f0f0f0}
.shop-label{font-size:12px;font-weight:700;color:#999;margin-bottom:6px;letter-spacing:.5px}
.shop-item{font-size:13px;color:#555;line-height:1.8}
@media(max-width:480px){h1{font-size:23px}.card-name{font-size:18px}.chip{font-size:14px;padding:9px 14px}}
</style>
</head>

const KEYS=["temp","method","spicy","cuisine","protein"];
let sel={temp:[],method:[],spicy:[],cuisine:[],protein:[]};

function getAvail(excKey){
  return DB.filter(m=>KEYS.every(k=>{
    if(k===excKey)return true;
    if(sel[k].length===0)return true;
    if(k==="protein")return sel[k].some(v=>m.protein.includes(v));
    if(k==="method")return sel[k].some(v=>m.method.includes(v));
    return sel[k].includes(m[k]);
  }));
}

function updateChips(){
  KEYS.forEach(k=>{
    const avail=getAvail(k);
    document.querySelectorAll(`[data-key="${k}"]`).forEach(c=>{
      const v=c.dataset.val;
      const exists=k==="protein"?avail.some(m=>m.protein.includes(v)):k==="method"?avail.some(m=>m.method.includes(v)):avail.some(m=>m[k]===v);
      c.classList.toggle("disabled",!exists&&!sel[k].includes(v));
    });
  });
}

document.querySelectorAll(".chip").forEach(c=>{
  c.addEventListener("click",()=>{
    const k=c.dataset.key,v=c.dataset.val;
    sel[k]=sel[k].includes(v)?sel[k].filter(x=>x!==v):[...sel[k],v];
    c.classList.toggle("on",sel[k].includes(v));
    updateChips();
    document.getElementById("results").style.display="none";
  });
});

document.getElementById("btn-reset").addEventListener("click",()=>{
  sel={temp:[],method:[],spicy:[],cuisine:[],protein:[]};
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("on","disabled"));
  document.getElementById("results").style.display="none";
});

function pick(){
  let pool=DB.filter(m=>KEYS.every(k=>{
    if(sel[k].length===0)return true;
    if(k==="protein")return sel[k].some(v=>m.protein.includes(v));
    if(k==="method")return sel[k].some(v=>m.method.includes(v));
    return sel[k].includes(m[k]);
  }));
  const res=document.getElementById("results");
  res.style.display="block";
  if(!pool.length){res.innerHTML='<div class="no-result">😅 조건에 맞는 메뉴가 없어요. 조건을 줄여보세요!</div>';return;}
  const picks=pool.sort(()=>Math.random()-.5).slice(0,Math.min(3,pool.length));
  res.innerHTML=`<div class="res-label">오늘의 추천 메뉴</div>`+picks.map((m,i)=>{
    const shops=SHOPS[m.n]||[];
    const shopHTML=shops.length?`<div class="shop-box"><div class="shop-label">📍 근처 맛집</div>${shops.map(s=>`<div class="shop-item">· ${s}</div>`).join("")}</div>`:"";
    return`<div class="card ${i===0?"top":""}">
      ${i===0?'<div class="badge">✨ 1순위 추천</div>':''}
      <div class="card-name">${m.n}</div>
      ${DESC[m.n]?`<div class="card-desc">${DESC[m.n]}</div>`:""}
      ${shopHTML}
    </div>`;
  }).join("")+`<button class="btn-retry" onclick="pick()">🔀 다시 뽑기</button>`;
  res.scrollIntoView({behavior:"smooth",block:"nearest"});
}

    opts:[

      {e:"😄", t:"기분 좋아요", s:"특별한 걸 먹고 싶어요"},
      {e:"😤", t:"스트레스 받았어요", s:"확 매운 거 당겨요"},
      {e:"🙂", t:"평범해요", s:"맛있으면 뭐든 OK"},
      {e:"🍻", t:"회식이에요", s:"단체 메뉴 추천받기"},
    ]
  },
  {
    key:"who", label:"2 / 4", q:"누구랑 먹어요?", sub:"인원에 맞는 메뉴를 추천해드릴게요",
    opts:[
      {e:"🙋", t:"혼자", s:"혼밥 가능한 메뉴로"},
      {e:"👫", t:"둘이", s:"오붓하게"},
      {e:"👨‍👩‍👧‍👦", t:"가족·친구", s:"여럿이서 즐겁게"},
    ]
  },
  {
    key:"hungry", label:"3 / 4", q:"얼마나 배고파요?", sub:"포만감에 맞는 메뉴로 추천해드릴게요",
    opts:[
      {e:"🥗", t:"가볍게", s:"간단하게 한 끼"},
      {e:"🍚", t:"든든하게", s:"배부르게 먹을래요"},
      {e:"💣", t:"배터지게", s:"오늘은 폭식"},
    ]
  },
  {
    key:"body", label:"4 / 4", q:"오늘 몸 상태는요?", sub:"컨디션에 맞는 메뉴로 골라드릴게요",
    opts:[
      {e:"🌡️", t:"더워요", s:"시원한 게 당겨요"},
      {e:"🥶", t:"추워요", s:"따뜻한 게 먹고 싶어요"},
      {e:"😮‍💨", t:"속이 안 좋아요", s:"자극 없는 메뉴로"},
      {e:"😊", t:"괜찮아요", s:"뭐든 괜찮아요"},
    ]
  },
];

const STEPS_HOESIK = [
  {
    key:"size", label:"1 / 2", q:"인원이 몇 명이에요?", sub:"인원에 맞는 회식 메뉴를 추천해드릴게요",
    opts:[
      {e:"👥", t:"2~4명", s:"소규모 회식"},
      {e:"👨‍👩‍👧‍👦", t:"5~10명", s:"중규모 회식"},
      {e:"🏢", t:"10명+", s:"단체 회식"},
    ]
  },
  {
    key:"body", label:"2 / 2", q:"오늘 분위기는요?", sub:"분위기에 맞는 메뉴를 추천해드릴게요",
    opts:[
      {e:"🍺", t:"가볍게 한 잔", s:"삼겹살·치킨 계열"},
      {e:"🥩", t:"제대로 먹자", s:"소고기·회·스시 계열"},
      {e:"🎉", t:"특별한 자리", s:"한정식·오마카세 계열"},
      {e:"💰", t:"가성비로", s:"부대찌개·감자탕 계열"},
    ]
  },
];

let curSteps = STEPS_NORMAL;
let curStep = 0;
let answers = {};
let isHoesik = false;

function renderStep(){
  const s = curSteps[curStep];
  document.getElementById('survey-step-label').textContent = s.label;
  document.getElementById('survey-question').textContent = s.q;
  document.getElementById('survey-sub').textContent = s.sub;
  const pct = ((curStep+1)/curSteps.length)*100;
  document.getElementById('survey-progress').style.width = pct+'%';
  const box = document.getElementById('survey-options');
  box.innerHTML = s.opts.map(o=>`
    <button class="sopt" onclick="selectOpt(this,'${s.key}','${o.t}')">
      <span class="sopt-emoji">${o.e}</span>
      <span class="sopt-text"><strong>${o.t}</strong>${o.s}</span>
    </button>`).join('');
  document.getElementById('survey-next').style.display='none';
}

function selectOpt(el, key, val){
  document.querySelectorAll('.sopt').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  answers[key] = val;
  // 기분에서 회식 선택 시 흐름 변경
  if(key==='mood' && val==='회식이에요'){
    isHoesik = true;
    curSteps = STEPS_HOESIK;
    curStep = 0;
    answers = {mood:'회식이에요'};
    setTimeout(()=>{ renderStep(); }, 300);
    return;
  }
  document.getElementById('survey-next').style.display='block';
}

function nextStep(){
  curStep++;
  if(curStep >= curSteps.length){
    finishSurvey();
  } else {
    renderStep();
  }
}

function finishSurvey(){
  document.getElementById('survey-box').style.display='none';
  if(isHoesik){
    showHoesikResult();
  } else {
    applyAndShowCategory();
  }
}

function showHoesikResult(){
  const size = answers.size || '5~10명';
  const vibe = answers.body || '가볍게 한 잔';
  const menus = HOESIK_MENUS[size] || HOESIK_MENUS['5~10명'];
  const res = document.getElementById('results');
  document.getElementById('category-box').style.display='block';
  res.style.display='block';

  // 분위기에 따라 필터
  let filtered = menus;
  if(vibe==='제대로 먹자') filtered = menus.filter(m=>['한우 등심구이','모둠회','스시 (초밥)','스테이크','소갈비구이'].includes(m.n));
  if(vibe==='가성비로') filtered = menus.filter(m=>['삼겹살','감자탕','부대찌개','족발','후라이드 치킨'].includes(m.n));
  if(vibe==='특별한 자리') filtered = menus.filter(m=>['스시 (초밥)','스테이크','한우 등심구이','샤부샤부','모둠회'].includes(m.n));
  if(filtered.length===0) filtered = menus;

  const picks = filtered.slice(0,3);
  res.innerHTML = `
    <div class="survey-result-banner">
      <div style="font-size:14px;font-weight:600;color:#3d37a0">🍻 회식 추천 결과</div>
      <div class="survey-tags">
        <span class="survey-tag">${size}</span>
        <span class="survey-tag">${vibe}</span>
      </div>
    </div>
    <div class="res-label">오늘의 추천 메뉴</div>
    ${picks.map((m,i)=>{
      const shops=SHOPS[m.n]||[];
      const shopHTML=shops.length?`<div class="shop-box"><div class="shop-label">📍 근처 맛집</div>${shops.map(s=>`<div class="shop-item">· ${s}</div>`).join('')}</div>`:'';
      return`<div class="card ${i===0?'top':''}">
        ${i===0?'<div class="badge">✨ 1순위 추천</div>':''}
        <div class="card-name">${m.n}</div>
        ${DESC[m.n]?`<div class="card-desc">${DESC[m.n]}</div>`:''}
        <div class="card-desc" style="color:#6c63d4;margin-top:4px;font-weight:500">💡 ${m.reason}</div>
        ${shopHTML}
      </div>`;
    }).join('')}
    <button class="btn-retry" onclick="resetToSurvey()">🔄 설문 다시하기</button>
    <button class="btn-retry" style="margin-left:8px" onclick="document.getElementById('survey-box').style.display='none';document.getElementById('category-box').style.display='block';">🎛️ 카테고리로 세부 조정</button>
  `;
}

function applyAndShowCategory(){
  // 설문 결과를 카테고리 필터에 자동 적용
  sel = {temp:[],method:[],spicy:[],cuisine:[],protein:[]};
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on','disabled'));

  const mood = answers.mood;
  const hungry = answers.hungry;
  const body = answers.body;

  if(body==='더워요') applyChip('temp','차가운');
  if(body==='추워요'||mood==='피곤해요') applyChip('temp','따뜻한');
  if(body==='속이 안 좋아요'){ applyChip('temp','따뜻한'); applyChip('spicy','안매운'); }
  if(mood==='스트레스 받았어요') applyChip('spicy','매운');
  if(hungry==='가볍게'){ applyChip('method','면류'); }
  if(hungry==='든든하게'){ applyChip('method','탕/찌개'); }
  if(hungry==='배터지게'){ applyChip('method','구이'); }

  updateChips();

  // 결과 배너 + 카테고리 박스 표시
  document.getElementById('category-box').style.display='block';
  const tags = [mood, answers.who, hungry, body].filter(Boolean);
  const bannerHTML = `
    <div class="survey-result-banner">
      <div style="font-size:13px;font-weight:600;color:#3d37a0">설문 결과가 반영됐어요</div>
      <div class="survey-tags">${tags.map(t=>`<span class="survey-tag">${t}</span>`).join('')}</div>
    </div>`;
  document.getElementById('category-box').insertAdjacentHTML('afterbegin', bannerHTML);
}

function applyChip(key, val){
  const chip = document.querySelector(`[data-key="${key}"][data-val="${val}"]`);
  if(chip){ chip.classList.add('on'); if(!sel[key].includes(val)) sel[key].push(val); }
}

function skipSurvey(){
  document.getElementById('survey-box').style.display='none';
  document.getElementById('category-box').style.display='block';
}

function resetToSurvey(){
  curSteps = STEPS_NORMAL;
  curStep = 0;
  answers = {};
  isHoesik = false;
  sel = {temp:[],method:[],spicy:[],cuisine:[],protein:[]};
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on','disabled'));
  document.querySelectorAll('.survey-result-banner').forEach(b=>b.remove());
  document.getElementById('results').style.display='none';
  document.getElementById('results').innerHTML='';
  document.getElementById('category-box').style.display='none';
  document.getElementById('survey-box').style.display='block';
  renderStep();
}

renderStep();


</script>
</body>
</html>
