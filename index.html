<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>오늘 저녁 뭐 먹지? 🍽️</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Malgun Gothic',sans-serif;background:#f7f6f2;min-height:100vh;padding:28px 16px 80px}
.wrap{max-width:680px;margin:0 auto}
h1{font-size:28px;font-weight:700;color:#1a1a1a;margin-bottom:6px}
.sub{font-size:15px;color:#888;margin-bottom:32px}
.section{margin-bottom:24px}
.sec-label{font-size:12px;font-weight:700;color:#999;letter-spacing:1px;margin-bottom:10px;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:99px;border:1.5px solid #ddd;background:#fff;font-size:15px;font-weight:400;color:#444;cursor:pointer;transition:all .15s;user-select:none;-webkit-tap-highlight-color:transparent}
.chip:hover{border-color:#aaa;background:#fafafa}
.chip.on{border-color:#6c63d4;background:#eeecff;color:#3d37a0;font-weight:600}
.chip.disabled{opacity:.25;pointer-events:none}
.btn-row{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}
.btn-main{padding:14px 36px;border-radius:99px;border:none;background:#6c63d4;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.btn-main:hover{background:#5a52be}
.btn-main:active{transform:scale(.97)}
.btn-sub{padding:14px 20px;border-radius:99px;border:1.5px solid #ddd;background:#fff;color:#888;font-size:15px;cursor:pointer}
.btn-sub:hover{border-color:#aaa;color:#555}
.results{margin-top:32px}
.res-label{font-size:12px;font-weight:700;color:#999;letter-spacing:1px;margin-bottom:14px;text-transform:uppercase}
.card{background:#fff;border-radius:18px;border:1.5px solid #eee;padding:20px 22px;margin-bottom:12px}
.card.top{border-color:#6c63d4;box-shadow:0 0 0 4px #eeecff}
.badge{font-size:11px;font-weight:700;background:#eeecff;color:#3d37a0;padding:3px 10px;border-radius:99px;margin-bottom:8px;display:inline-block}
.card-name{font-size:21px;font-weight:700;color:#1a1a1a;margin-bottom:8px}
.card-tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;background:#f4f4f4;color:#666;padding:4px 11px;border-radius:99px}
.no-result{padding:20px;border-radius:14px;border:1.5px solid #eee;background:#fafafa;color:#888;font-size:15px;text-align:center}
.btn-retry{margin-top:14px;padding:10px 22px;border-radius:99px;border:1.5px solid #ddd;background:#fff;color:#777;font-size:14px;cursor:pointer}
.btn-retry:hover{border-color:#aaa}
.shop-box{margin-top:12px;padding-top:12px;border-top:1px solid #f0f0f0}
.shop-label{font-size:12px;font-weight:700;color:#999;margin-bottom:6px;letter-spacing:.5px}
.shop-item{font-size:13px;color:#555;line-height:1.8}
@media(max-width:480px){h1{font-size:23px}.card-name{font-size:18px}.chip{font-size:14px;padding:9px 14px}}
</style>
</head>

const KEYS=["temp","method","spicy","cuisine","protein"];
let sel={temp:[],method:[],spicy:[],cuisine:[],protein:[]};

function getAvail(excKey){
  return DB.filter(m=>KEYS.every(k=>{
    if(k===excKey)return true;
    if(sel[k].length===0)return true;
    if(k==="protein")return sel[k].some(v=>m.protein.includes(v));
    if(k==="method")return sel[k].some(v=>m.method.includes(v));
    return sel[k].includes(m[k]);
  }));
}

function updateChips(){
  KEYS.forEach(k=>{
    const avail=getAvail(k);
    document.querySelectorAll(`[data-key="${k}"]`).forEach(c=>{
      const v=c.dataset.val;
      const exists=k==="protein"?avail.some(m=>m.protein.includes(v)):k==="method"?avail.some(m=>m.method.includes(v)):avail.some(m=>m[k]===v);
      c.classList.toggle("disabled",!exists&&!sel[k].includes(v));
    });
  });
}

document.querySelectorAll(".chip").forEach(c=>{
  c.addEventListener("click",()=>{
    const k=c.dataset.key,v=c.dataset.val;
    sel[k]=sel[k].includes(v)?sel[k].filter(x=>x!==v):[...sel[k],v];
    c.classList.toggle("on",sel[k].includes(v));
    updateChips();
    document.getElementById("results").style.display="none";
  });
});

document.getElementById("btn-reset").addEventListener("click",()=>{
  sel={temp:[],method:[],spicy:[],cuisine:[],protein:[]};
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("on","disabled"));
  document.getElementById("results").style.display="none";
});

function pick(){
  let pool=DB.filter(m=>KEYS.every(k=>{
    if(sel[k].length===0)return true;
    if(k==="protein")return sel[k].some(v=>m.protein.includes(v));
    if(k==="method")return sel[k].some(v=>m.method.includes(v));
    return sel[k].includes(m[k]);
  }));
  const res=document.getElementById("results");
  res.style.display="block";
  if(!pool.length){res.innerHTML='<div class="no-result">😅 조건에 맞는 메뉴가 없어요. 조건을 줄여보세요!</div>';return;}
  const picks=pool.sort(()=>Math.random()-.5).slice(0,Math.min(3,pool.length));
  res.innerHTML=`<div class="res-label">오늘의 추천 메뉴</div>`+picks.map((m,i)=>{
    const shops=SHOPS[m.n]||[];
    const shopHTML=shops.length?`<div class="shop-box"><div class="shop-label">📍 근처 맛집</div>${shops.map(s=>`<div class="shop-item">· ${s}</div>`).join("")}</div>`:"";
    return`<div class="card ${i===0?"top":""}">
      ${i===0?'<div class="badge">✨ 1순위 추천</div>':''}
      <div class="card-name">${m.n}</div>

      ${shopHTML}
    </div>`;
  }).join("")+`<button class="btn-retry" onclick="pick()">🔀 다시 뽑기</button>`;
  res.scrollIntoView({behavior:"smooth",block:"nearest"});
}
