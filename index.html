<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘 저녁 뭐 먹지? 🍽️</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Malgun Gothic',sans-serif;background:#f7f6f2;min-height:100vh;padding:28px 16px 80px}
.wrap{max-width:680px;margin:0 auto}
h1{font-size:28px;font-weight:700;color:#1a1a1a;margin-bottom:6px}
.sub{font-size:15px;color:#888;margin-bottom:24px}
/* 메인 탭 */
.main-tab{flex:1;padding:12px 0;border:none;background:none;font-size:15px;font-weight:500;color:#aaa;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s}
.main-tab.on{color:#6c63d4;border-bottom:3px solid #6c63d4;font-weight:700}

.survey-box{margin-bottom:28px}
.s-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.s-step{font-size:12px;font-weight:700;color:#6c63d4;letter-spacing:1px;margin-bottom:3px}
.s-q{font-size:20px;font-weight:700;color:#1a1a1a}
.s-sub{font-size:13px;color:#999;margin-top:2px}
.s-skip{font-size:12px;color:#bbb;background:none;border:none;cursor:pointer;padding:4px 8px;white-space:nowrap}
.s-bar-wrap{height:4px;background:#eee;border-radius:99px;margin-bottom:18px}
.s-bar{height:4px;background:#6c63d4;border-radius:99px;transition:width .3s}
.s-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sopt{padding:14px 16px;border-radius:14px;border:1.5px solid #eee;background:#fff;cursor:pointer;text-align:left;transition:all .15s;display:flex;align-items:center;gap:10px}
.sopt:hover{border-color:#aaa}
.sopt.on{border-color:#6c63d4;background:#eeecff}
.sopt-e{font-size:22px;flex-shrink:0}
.sopt-t{font-size:15px;font-weight:700;color:#1a1a1a;display:block}
.sopt.on .sopt-t{color:#3d37a0}
.sopt-s{font-size:12px;color:#999;display:block;margin-top:1px}
.s-next{display:none;padding:10px 24px;border-radius:99px;border:none;background:#6c63d4;color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-top:14px;float:right}
/* 배너 */
.sv-banner{background:#eeecff;border-radius:14px;padding:13px 16px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.sv-banner-title{font-size:13px;font-weight:700;color:#3d37a0}
.sv-tags{display:flex;flex-wrap:wrap;gap:5px}
.sv-tag{font-size:12px;background:#6c63d4;color:#fff;padding:3px 9px;border-radius:99px;font-weight:500}
/* 카테고리 */
.cat-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.cat-title{font-size:15px;font-weight:700;color:#1a1a1a}
.btn-resurvey{font-size:12px;color:#6c63d4;background:none;border:1.5px solid #6c63d4;border-radius:99px;padding:5px 12px;cursor:pointer}
.section{margin-bottom:22px}
.sec-label{font-size:12px;font-weight:700;color:#999;letter-spacing:1px;margin-bottom:10px;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:99px;border:1.5px solid #ddd;background:#fff;font-size:15px;font-weight:400;color:#444;cursor:pointer;transition:all .15s;user-select:none}
.chip:hover{border-color:#aaa}
.chip.on{border-color:#6c63d4;background:#eeecff;color:#3d37a0;font-weight:600}
.chip.disabled{opacity:.25;pointer-events:none}
.btn-row{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.btn-main{padding:14px 36px;border-radius:99px;border:none;background:#6c63d4;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.btn-main:hover{background:#5a52be}
.btn-sub{padding:14px 20px;border-radius:99px;border:1.5px solid #ddd;background:#fff;color:#888;font-size:15px;cursor:pointer}
/* 결과 */
.results{margin-top:28px}
.res-label{font-size:12px;font-weight:700;color:#999;letter-spacing:1px;margin-bottom:14px;text-transform:uppercase}
.card{background:#fff;border-radius:18px;border:1.5px solid #eee;padding:20px 22px;margin-bottom:12px}
.card.top{border-color:#6c63d4;box-shadow:0 0 0 4px #eeecff}
.badge{font-size:11px;font-weight:700;background:#eeecff;color:#3d37a0;padding:3px 10px;border-radius:99px;margin-bottom:8px;display:inline-block}
.card-name{font-size:21px;font-weight:700;color:#1a1a1a;margin-bottom:4px}
.card-desc{font-size:13px;color:#888;line-height:1.5;margin-bottom:0}
.card-reason{font-size:13px;color:#6c63d4;font-weight:500;margin-top:4px}
.shop-box{margin-top:12px;padding-top:12px;border-top:1px solid #f0f0f0}
.shop-label{font-size:12px;font-weight:700;color:#999;margin-bottom:6px}
.shop-item{font-size:13px;color:#555;line-height:1.8}
.btn-retry{margin-top:12px;padding:9px 18px;border-radius:99px;border:1.5px solid #ddd;background:#fff;color:#777;font-size:13px;cursor:pointer;margin-right:6px}
.btn-retry:hover{border-color:#aaa}
/* 회식 결과 */
.hoesik-box{margin-top:28px}
@media(max-width:480px){h1{font-size:22px}.s-grid{grid-template-columns:1fr}.card-name{font-size:18px}.chip{font-size:14px;padding:9px 14px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>오늘 저녁 뭐 먹지? 🍽️</h1>
  <p class="sub">오늘 뭐 먹을지 고민될 때 딱!</p>

  <!-- 메인 탭 -->
  <div style="display:flex;gap:0;margin-bottom:28px;border-bottom:2px solid #eee">
    <button class="main-tab on" id="tab-survey" onclick="switchMainTab('survey')">🎯 설문 추천</button>
    <button class="main-tab" id="tab-random" onclick="switchMainTab('random')">🎲 랜덤 추천</button>
  </div>

  <!-- 설문 탭 영역 -->
  <div id="panel-survey">
    <!-- 설문 -->
    <div class="survey-box" id="survey-box">
      <div class="s-header">
        <div>
          <div class="s-step" id="s-step">1 / 5</div>
          <div class="s-q" id="s-q">오늘 기분이 어때요?</div>
          <div class="s-sub" id="s-sub">입맛에 맞는 메뉴를 골라드릴게요</div>
        </div>
        <button class="s-skip" onclick="skipSurvey()">건너뛰기</button>
      </div>
      <div class="s-bar-wrap"><div class="s-bar" id="s-bar" style="width:20%"></div></div>
      <div class="s-grid" id="s-opts"></div>
      <div style="overflow:hidden">
        <button class="s-next" id="s-next" onclick="nextStep()">다음 →</button>
      </div>
    </div>
    <!-- 설문 결과 -->
    <div id="survey-result-area" style="display:none">
      <div id="sv-banner"></div>
      <div class="results" id="results-survey"></div>
      <div style="margin-top:16px">
        <button class="btn-retry" onclick="resetAll()">🔄 설문 다시하기</button>
      </div>
    </div>
  </div>

  <!-- 랜덤 탭 영역 -->
  <div id="panel-random" style="display:none">
    <div id="random-banner"></div>
    <p style="font-size:14px;color:#999;margin-bottom:20px">조건을 골라보세요 — 안 골라도 되고, 여러 개도 됩니다</p>
    <div class="section">
      <div class="sec-label">온도</div>
      <div class="chips">
        <div class="chip" data-key="temp" data-val="따뜻한">🔥 따뜻한</div>
        <div class="chip" data-key="temp" data-val="차가운">❄️ 차가운</div>
      </div>
    </div>
    <div class="section">
      <div class="sec-label">조리 방식</div>
      <div class="chips">
        <div class="chip" data-key="method" data-val="탕/찌개">🍲 탕·찌개</div>
        <div class="chip" data-key="method" data-val="밥류">🍚 밥류</div>
        <div class="chip" data-key="method" data-val="면류">🍜 면류</div>
        <div class="chip" data-key="method" data-val="찜">♨️ 찜</div>
        <div class="chip" data-key="method" data-val="구이">🔥 구이</div>
        <div class="chip" data-key="method" data-val="볶음">🥘 볶음</div>
        <div class="chip" data-key="method" data-val="튀김">🍳 튀김</div>
        <div class="chip" data-key="method" data-val="생">🐠 생(회류)</div>
      </div>
    </div>
    <div class="section">
      <div class="sec-label">맵기</div>
      <div class="chips">
        <div class="chip" data-key="spicy" data-val="매운">🌶️ 매운</div>
        <div class="chip" data-key="spicy" data-val="안매운">😌 안 매운</div>
      </div>
    </div>
    <div class="section">
      <div class="sec-label">요리 종류</div>
      <div class="chips">
        <div class="chip" data-key="cuisine" data-val="한식">🇰🇷 한식</div>
        <div class="chip" data-key="cuisine" data-val="일식">🍣 일식</div>
        <div class="chip" data-key="cuisine" data-val="중식">🥢 중식</div>
        <div class="chip" data-key="cuisine" data-val="양식">🍝 양식</div>
        <div class="chip" data-key="cuisine" data-val="동남아식">🌴 동남아</div>
        <div class="chip" data-key="cuisine" data-val="인도식">🇮🇳 인도</div>
        <div class="chip" data-key="cuisine" data-val="멕시코식">🌮 멕시코</div>
        <div class="chip" data-key="cuisine" data-val="퓨전">✨ 퓨전</div>
      </div>
    </div>
    <div class="section">
      <div class="sec-label">주재료</div>
      <div class="chips">
        <div class="chip" data-key="protein" data-val="소고기">🥩 소고기</div>
        <div class="chip" data-key="protein" data-val="돼지고기">🐷 돼지고기</div>
        <div class="chip" data-key="protein" data-val="닭고기">🍗 닭고기</div>
        <div class="chip" data-key="protein" data-val="양고기">🐑 양고기</div>
        <div class="chip" data-key="protein" data-val="해산물">🦐 해산물</div>
        <div class="chip" data-key="protein" data-val="채소">🥬 채소·두부</div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-main" id="btn-pick">🎲 추천받기</button>
      <button class="btn-sub" id="btn-reset">초기화</button>
    </div>
    <div class="results" id="results-random" style="display:none"></div>
  </div>
</div>

<script>
// ===== 메인 탭 =====
function switchMainTab(tab){
  document.getElementById('tab-survey').classList.toggle('on', tab==='survey');
  document.getElementById('tab-random').classList.toggle('on', tab==='random');
  document.getElementById('panel-survey').style.display = tab==='survey' ? 'block' : 'none';
  document.getElementById('panel-random').style.display = tab==='random' ? 'block' : 'none';
}

function goToRandomWithSurvey(){
  // 설문 결과를 랜덤 탭 칩에 반영하고 랜덤 탭으로 이동
  applySurveyToChips();
  const tags = [answers.mood, answers.region, answers.who, answers.hungry, answers.body].filter(t => t && t !== '상관없어요');
  document.getElementById('random-banner').innerHTML = `
    <div class="sv-banner" style="margin-bottom:16px">
      <div class="sv-banner-title">설문 결과 반영됨</div>
      <div class="sv-tags">${tags.map(t=>`<span class="sv-tag">${t}</span>`).join('')}</div>
    </div>`;
  switchMainTab('random');
}

let curSteps = STEPS_NORMAL;
let curStep = 0;
let answers = {};
let isHoesik = false;

function renderStep(){
  const s = curSteps[curStep];
  document.getElementById('s-step').textContent = s.step;
  document.getElementById('s-q').textContent = s.q;
  document.getElementById('s-sub').textContent = s.sub;
  const pct = ((curStep+1)/curSteps.length)*100;
  document.getElementById('s-bar').style.width = pct+'%';
  document.getElementById('s-next').style.display = 'none';
  document.getElementById('s-opts').innerHTML = s.opts.map(o =>
    `<button class="sopt" onclick="selectOpt(this,'${s.key}','${o.t.replace(/'/g,"\\'")}')">
      <span class="sopt-e">${o.e}</span>
      <span><span class="sopt-t">${o.t}</span><span class="sopt-s">${o.s}</span></span>
    </button>`
  ).join('');
}

function selectOpt(el, key, val){
  document.querySelectorAll('.sopt').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
  answers[key] = val;
  if(key === 'mood' && val === '회식이에요'){
    isHoesik = true;
    curSteps = STEPS_HOESIK;
    curStep = 0;
    answers = {mood:'회식이에요'};
    setTimeout(renderStep, 300);
    return;
  }
  document.getElementById('s-next').style.display = 'block';
}

function nextStep(){
  curStep++;
  if(curStep >= curSteps.length){
    finishSurvey();
  } else {
    renderStep();
  }
}

// ===== 카테고리 필터 =====
const KEYS = ["temp","method","spicy","cuisine","protein"];
let sel = {temp:[],method:[],spicy:[],cuisine:[],protein:[]};

function getAvail(excKey){
  return DB.filter(m => KEYS.every(k => {
    if(k === excKey) return true;
    if(sel[k].length === 0) return true;
    if(k === "protein") return sel[k].some(v => m.protein.includes(v));
    if(k === "method") return sel[k].some(v => m.method.includes(v));
    return sel[k].includes(m[k]);
  }));
}

function updateChips(){
  KEYS.forEach(k => {
    const avail = getAvail(k);
    document.querySelectorAll(`[data-key="${k}"]`).forEach(c => {
      const v = c.dataset.val;
      const exists = k==="protein" ? avail.some(m=>m.protein.includes(v)) :
                     k==="method"  ? avail.some(m=>m.method.includes(v)) :
                     avail.some(m=>m[k]===v);
      c.classList.toggle("disabled", !exists && !sel[k].includes(v));
    });
  });
}

document.querySelectorAll(".chip").forEach(c => {
  c.addEventListener("click", () => {
    const k = c.dataset.key, v = c.dataset.val;
    sel[k] = sel[k].includes(v) ? sel[k].filter(x=>x!==v) : [...sel[k], v];
    c.classList.toggle("on", sel[k].includes(v));
    updateChips();
    document.getElementById("results").style.display = "none";
  });
});

document.getElementById("btn-reset").addEventListener("click", () => {
  sel = {temp:[],method:[],spicy:[],cuisine:[],protein:[]};
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("on","disabled"));
  document.getElementById("results").style.display = "none";
});

function pick(){
  let pool = DB.filter(m => KEYS.every(k => {
    if(sel[k].length === 0) return true;
    if(k === "protein") return sel[k].some(v=>m.protein.includes(v));
    if(k === "method") return sel[k].some(v=>m.method.includes(v));
    return sel[k].includes(m[k]);
  }));
  const res = document.getElementById("results-random");
  res.style.display = "block";
  if(!pool.length){
    res.innerHTML = '<div style="padding:20px;border-radius:14px;border:1.5px solid #eee;background:#fafafa;color:#888;font-size:15px;text-align:center">😅 조건에 맞는 메뉴가 없어요. 조건을 줄여보세요!</div>';
    return;
  }
  const picks = pool.sort(()=>Math.random()-.5).slice(0, Math.min(3, pool.length));
  res.innerHTML = `<div class="res-label">오늘의 추천 메뉴</div>` +
    picks.map((m,i) => {
      const shops = SHOPS[m.n] || [];
      const shopHTML = shops.length ? `<div class="shop-box"><div class="shop-label">📍 근처 맛집</div>${shops.map(s=>`<div class="shop-item">· ${s}</div>`).join('')}</div>` : '';
      return `<div class="card ${i===0?'top':''}">
        ${i===0?'<div class="badge">✨ 1순위 추천</div>':''}
        <div class="card-name">${m.n}</div>
        ${DESC[m.n]?`<div class="card-desc">${DESC[m.n]}</div>`:''}
        ${shopHTML}
      </div>`;
    }).join('') +
    `<button class="btn-retry" onclick="pick()">🔀 다시 뽑기</button>`;
  res.scrollIntoView({behavior:"smooth",block:"nearest"});
}
